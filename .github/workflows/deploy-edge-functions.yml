name: Deploy Edge Functions

# Deploy exclusivamente manual. A requisição precisa apontar para o SHA exato
# da main, ter CI verde no mesmo SHA e confirmar explicitamente produção.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Opcional. Deixe vazio ou 'auto' = usa o commit da main selecionada. Só preencha SHA (40 chars) se quiser travar uma versão específica."
        required: false
        default: "auto"
        type: string
      function_names:
        description: "Slugs separados por vírgula (ex.: sync-igreen-customers); use all somente com confirmação adicional"
        required: true
        type: string
      confirm_production:
        description: "Confirmo que este deploy é para produção"
        required: true
        default: false
        type: boolean
      confirm_all:
        description: 'Para function_names=all, digite exatamente DEPLOY_ALL'
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-edge-functions-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: zlzasfhcxcznaprrragl
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  validate-request:
    name: Validar escopo e SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      functions: ${{ steps.request.outputs.functions }}
      deploy_all: ${{ steps.request.outputs.deploy_all }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - id: request
        name: Validar requisição contra allowlist do SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUESTED_FUNCTIONS: ${{ inputs.function_names }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          CONFIRM_ALL: ${{ inputs.confirm_all }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Deploy permitido somente a partir de refs/heads/main." >&2
            exit 1
          fi

          # SHA opcional: vazio / auto / HEAD / main → commit da branch selecionada no Run workflow.
          RAW_SHA="$(printf '%s' "${EXPECTED_SHA:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$RAW_SHA" || "$RAW_SHA" == "auto" || "$RAW_SHA" == "head" || "$RAW_SHA" == "main" ]]; then
            RAW_SHA="$GITHUB_SHA"
            echo "expected_sha automático → $RAW_SHA"
          fi
          if [[ ! "$RAW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha inválido. Use vazio/auto ou um SHA completo (40 hex)." >&2
            exit 1
          fi
          if [[ "$RAW_SHA" != "$GITHUB_SHA" ]]; then
            echo "SHA informado ($RAW_SHA) não corresponde ao commit selecionado no dispatch ($GITHUB_SHA)." >&2
            echo "Dica: deixe expected_sha = auto (ou vazio) e escolha a branch main no Run workflow." >&2
            exit 1
          fi
          if [[ "$CONFIRM_PRODUCTION" != "true" ]]; then
            echo "Produção não foi confirmada explicitamente." >&2
            exit 1
          fi

          INPUT="$(printf '%s' "$REQUESTED_FUNCTIONS" | tr -d '[:space:]')"
          if [[ -z "$INPUT" ]]; then
            echo "Informe ao menos uma função; entrada vazia nunca significa all." >&2
            exit 1
          fi

          if [[ "$INPUT" == "all" ]]; then
            if [[ "$CONFIRM_ALL" != "DEPLOY_ALL" ]]; then
              echo "Deploy total exige confirm_all=DEPLOY_ALL." >&2
              exit 1
            fi
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"
            echo "functions=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Só rejeita o token exato "all" misturado com outras funções
          # (não use *all* — quebrava slugs como manual-step-send).
          if [[ ",$INPUT," == *",all,"* ]]; then
            echo "all não pode ser combinado com nomes de funções." >&2
            exit 1
          fi

          mapfile -t ALLOWLIST < <(
            find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | grep -E '^[a-z0-9][a-z0-9-]*$' \
              | sort -u
          )
          declare -A ALLOWED=()
          for function_name in "${ALLOWLIST[@]}"; do
            ALLOWED["$function_name"]=1
          done

          IFS=',' read -r -a REQUESTED <<< "$INPUT"
          declare -A SEEN=()
          VALIDATED=()
          for function_name in "${REQUESTED[@]}"; do
            if [[ ! "$function_name" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "Slug inválido: $function_name" >&2
              exit 1
            fi
            if [[ -z "${ALLOWED[$function_name]:-}" ]]; then
              echo "Função fora da allowlist deste SHA: $function_name" >&2
              exit 1
            fi
            if [[ -z "${SEEN[$function_name]:-}" ]]; then
              VALIDATED+=("$function_name")
              SEEN["$function_name"]=1
            fi
          done

          if [[ "${#VALIDATED[@]}" -eq 0 ]]; then
            echo "Nenhuma função válida foi informada." >&2
            exit 1
          fi

          JSON="$(printf '%s\n' "${VALIDATED[@]}" | python3 -c \
            'import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')"
          echo "deploy_all=false" >> "$GITHUB_OUTPUT"
          echo "functions=$JSON" >> "$GITHUB_OUTPUT"

  require-green-ci:
    name: Exigir CI verde no mesmo SHA
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verificar workflow CI concluído com sucesso
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=20")"
          printf '%s' "$RESPONSE" | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          sha = "${{ github.sha }}"
          runs = [run for run in payload.get("workflow_runs", []) if run.get("head_sha") == sha]
          if not any(run.get("conclusion") == "success" for run in runs):
              raise SystemExit(f"Nenhum CI verde e concluído encontrado para o SHA {sha}")
          '

  deploy-all:
    name: Deploy total confirmado
    needs: [validate-request, require-green-ci]
    if: needs.validate-request.outputs.deploy_all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Deploy de todas as funções
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

  deploy-selected:
    name: Deploy ${{ matrix.function }}
    needs: [validate-request, require-green-ci]
    if: needs.validate-request.outputs.deploy_all == 'false' && needs.validate-request.outputs.functions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        function: ${{ fromJSON(needs.validate-request.outputs.functions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Deploy ${{ matrix.function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -d "supabase/functions/${{ matrix.function }}"
          supabase functions deploy "${{ matrix.function }}" \
            --project-ref "$SUPABASE_PROJECT_REF"
