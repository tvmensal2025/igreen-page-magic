name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Concurrency: cancela build anterior do mesmo branch quando um novo é pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  deno-check:
    name: Deno typecheck (Edge Functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Typecheck dos módulos de produção (exclui *_test.ts e __tests__/).
      - name: Typecheck core modules
        run: |
          set -euo pipefail
          mapfile -t FILES < <(
            find supabase/functions/_shared/channels \
                 supabase/functions/_shared/engine \
                 supabase/functions/_shared/captation \
                 supabase/functions/_shared/conversion \
                 supabase/functions/_shared/performance \
                 -name '*.ts' ! -name '*_test.ts' ! -name '*.test.ts' ! -path '*/__tests__/*'
            printf '%s\n' \
              supabase/functions/_shared/customer-flow-state.ts \
              supabase/functions/_shared/customer-pause-filter.ts \
              supabase/functions/_shared/logger.ts \
              supabase/functions/_shared/human-pace.ts \
              supabase/functions/inbound-media-retry-cron/index.ts
          )
          deno check "${FILES[@]}"
      - name: Typecheck webhooks
        run: |
          deno check supabase/functions/evolution-webhook/index.ts \
                     supabase/functions/whapi-webhook/index.ts
      - name: Typecheck Meta Ads hardening surface
        run: |
          deno check \
            supabase/functions/_shared/ad-automation-policy.ts \
            supabase/functions/_shared/ad-publish-saga.ts \
            supabase/functions/_shared/ads-anchor.ts \
            supabase/functions/_shared/ads-spend-billing.ts \
            supabase/functions/_shared/brain-config.ts \
            supabase/functions/_shared/campaign-tracking.ts \
            supabase/functions/_shared/canonical-json.ts \
            supabase/functions/_shared/capi-event.ts \
            supabase/functions/facebook-capi/index.ts \
            supabase/functions/facebook-capi-dispatch/index.ts \
            supabase/functions/facebook-repair-campaign-tracking/index.ts \
            supabase/functions/_shared/cbo-abo.ts \
            supabase/functions/_shared/safe-image-fetch.ts \
            supabase/functions/_shared/cron-auth.ts \
            supabase/functions/_shared/fb-graph.ts \
            supabase/functions/ad-competitor-scraper/index.ts \
            supabase/functions/ad-creative-learner/index.ts \
            supabase/functions/ad-creative-qa/index.ts \
            supabase/functions/ad-image-validator/index.ts \
            supabase/functions/campaign-brain-rank/index.ts \
            supabase/functions/facebook-auto-pause/index.ts \
            supabase/functions/facebook-balance-check/index.ts \
            supabase/functions/facebook-balance-reconcile/index.ts \
            supabase/functions/facebook-campaign-healthcheck/index.ts \
            supabase/functions/facebook-cbo-to-abo/index.ts \
            supabase/functions/facebook-cpl-correction/index.ts \
            supabase/functions/facebook-create-campaign/index.ts \
            supabase/functions/facebook-creative-rotator/index.ts \
            supabase/functions/facebook-mg-city-rotator/index.ts \
            supabase/functions/facebook-realign-lifetime/index.ts \
            supabase/functions/facebook-retarget-sync/index.ts \
            supabase/functions/facebook-sync-ad-creatives/index.ts \
            supabase/functions/facebook-sync-metrics/index.ts \
            supabase/functions/facebook-token-refresh/index.ts
      - name: Test Meta Ads hardening guards
        run: |
          deno test --allow-env \
            supabase/functions/_shared/cron-auth_test.ts \
            supabase/functions/_shared/brain-config_test.ts \
            supabase/functions/_shared/fb-graph_test.ts \
            supabase/functions/_shared/ad-automation-policy_test.ts \
            supabase/functions/_shared/canonical-json_test.ts \
            supabase/functions/_shared/cbo-abo_test.ts \
            supabase/functions/_shared/safe-image-fetch_test.ts \
            supabase/functions/_shared/ads-spend-billing_test.ts \
            supabase/functions/_shared/ad-publish-saga_test.ts \
            supabase/functions/_shared/capi-event_test.ts \
            supabase/functions/_shared/ads-anchor_test.ts \
            supabase/functions/_shared/campaign-tracking_protocol_test.ts

  deno-test:
    name: Deno tests (PBT + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Deno tests
        run: |
          deno test --allow-env --allow-read --no-check \
            supabase/functions/_shared/channels/ \
            supabase/functions/_shared/engine/ \
            supabase/functions/_shared/human-pace_test.ts \
            supabase/functions/_shared/text-hash_test.ts \
            supabase/functions/_shared/grounding_test.ts \
            supabase/functions/_shared/bot/ \
            supabase/functions/_shared/whapi-api_sendbuttons_test.ts \
            supabase/functions/_shared/whapi-api_inbound_meta_test.ts \
            supabase/functions/_shared/channels/idempotency-from-ctx_test.ts \
            supabase/functions/_shared/channels/adapter-idempotency_test.ts \
            supabase/functions/_shared/__tests__/config-toml-webhook-guard_test.ts

  engine-purity-check:
    name: Engine purity lint (v3-runner.ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Verifica que `v3-runner.ts` é puro: sem supabase-js, fetch,
      # Date.now, Math.random, crypto.randomUUID, setTimeout/Interval.
      # Spec: flow-engine-v3-rewrite Task 4. Design §2.1, §2.4.
      - name: Run purity lint
        run: |
          deno test --allow-read --no-check \
            supabase/functions/_shared/engine/__tests__/purity_lint_test.ts

  agent-docs-drift:
    name: Agent docs drift (Cursor ↔ Kiro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check mirrors + inclusion + DNC labels
        run: bash scripts/check-agent-docs-drift.sh

  spec-format:
    name: Kiro spec format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Validação de formato é feita pelo IDE Kiro. Este step apenas garante
      # que os arquivos canônicos existem nas specs ativas.
      - name: Verify spec files exist
        run: |
          test -f .kiro/specs/whatsapp-flow-architecture-v3/requirements.md
          test -f .kiro/specs/whatsapp-flow-architecture-v3/design.md
          test -f .kiro/specs/whatsapp-flow-architecture-v3/tasks.md
          test -f .kiro/specs/whatsapp-flow-reliability-fix/tasks.md
