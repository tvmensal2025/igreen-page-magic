<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<title>iGreen Sync</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; width: 340px; padding: 0; margin: 0; background: #0f172a; color: #f1f5f9; }
  .header { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); padding: 16px 16px 14px; display: flex; align-items: center; gap: 10px; }
  .header img { width: 36px; height: 36px; border-radius: 8px; background: white; padding: 2px; }
  .header h1 { font-size: 15px; margin: 0; font-weight: 700; }
  .header p { font-size: 11px; margin: 2px 0 0; opacity: 0.9; }
  .body { padding: 14px; }
  .motivation { font-size: 11px; color: #86efac; font-style: italic; text-align: center; padding: 8px; background: rgba(34, 197, 94, 0.08); border-radius: 6px; margin-bottom: 12px; min-height: 30px; display: flex; align-items: center; justify-content: center; }
  label { font-size: 12px; color: #94a3b8; display: block; margin-top: 4px; }
  input[type=password], input[type=text] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #f1f5f9; font-size: 12px; box-sizing: border-box; margin-top: 4px; }
  button { width: 100%; padding: 10px; margin-top: 12px; background: linear-gradient(135deg, #16a34a, #15803d); border: none; border-radius: 6px; color: white; font-weight: 600; cursor: pointer; font-size: 13px; transition: transform 0.1s; }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .row { display: flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 12px; }
  .row label { margin: 0; color: #cbd5e1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; display: inline-block; margin-right: 6px; }
  .dot.ok { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .dot.err { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
  .status { margin-top: 12px; padding: 10px; background: #1e293b; border-radius: 6px; font-size: 11px; color: #cbd5e1; max-height: 120px; overflow: auto; white-space: pre-wrap; line-height: 1.5; }
  small { color: #64748b; font-size: 10px; display: block; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="header">
    <img src="icon.png" alt="G" />
    <div>
      <h1>iGreen Sync</h1>
      <p>Sincronizando energia limpa</p>
    </div>
  </div>
  <div class="body">
    <div class="motivation" id="motivation">Cada sync acende um novo cliente solar.</div>

    <label>Token de pareamento</label>
    <input id="token" type="password" placeholder="cole o token gerado no painel" />

    <button id="sync"><span class="dot" id="dot"></span>Sincronizar agora</button>

    <div class="row">
      <input type="checkbox" id="auto" />
      <label for="auto">Sincronizar automaticamente (a cada 6h)</label>
    </div>

    <div class="status" id="status">Aguardando...</div>

    <small>Voce precisa estar logado em <b>escritorio.igreenenergy.com.br</b> nesta mesma sessao do navegador.</small>
  </div>
  <script src="popup.js"></script>
</body>
</html>
