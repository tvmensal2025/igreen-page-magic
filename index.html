<!doctype html>
<html lang="pt-BR" class="light" style="color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <!-- FOUC: aplica light|dark antes do React (chave igreen-theme). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("igreen-theme");
          if (t !== "dark" && t !== "light") t = "light";
          var r = document.documentElement;
          r.classList.remove("light", "dark", "system");
          r.classList.add(t);
          r.style.colorScheme = t;
          r.dataset.theme = t;
        } catch (e) { /* keep class=light do html */ }
      })();
    </script>
    <!-- Anti-cache client-side: Lovable Hosting não processa public/_headers,
         então forçamos revalidação aqui. Qualquer deploy novo é detectado
         pelo navegador na próxima navegação. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
